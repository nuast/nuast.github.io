---
layout: default
---
<main id="main-content" class="page-main">
  <section class="page-hero">
    <div class="container">
      <h1>{{ page.title }}</h1>
      {% if page.lead %}
        <p class="lead">{{ page.lead }}</p>
      {% endif %}
    </div>
  </section>
  <section class="page-body">
    <div class="container">
      {{ content }}
    </div>
  </section>
</main>
